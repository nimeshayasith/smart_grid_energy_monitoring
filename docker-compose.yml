# GridPulse – full Kappa-architecture stack
# Start everything: docker compose up -d
# Shut down:        docker compose down -v

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-gridpulse-secret-key}
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow_secret}@postgres/${AIRFLOW_DB:-airflow}
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  KAFKA_BOOTSTRAP_SERVERS:    ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  KAFKA_TOPIC_TARIFF_UPDATES: ${KAFKA_TOPIC_TARIFF_UPDATES:-tariff-updates}
  NUM_METERS:                 ${NUM_METERS:-30}
  GRID_ZONES:                 ${GRID_ZONES:-ZONE_A,ZONE_B,ZONE_C}
  POSTGRES_HOST:              ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT:              ${POSTGRES_PORT:-5432}
  POSTGRES_DB:                ${POSTGRES_DB:-gridpulse}
  POSTGRES_USER:              ${POSTGRES_USER:-gridpulse}
  POSTGRES_PASSWORD:          ${POSTGRES_PASSWORD:-gridpulse_secret}
  GENERATORS_PATH:            /opt/airflow/generators

x-spark-env: &spark-env
  KAFKA_BOOTSTRAP_SERVERS:    ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  KAFKA_TOPIC_METER_READINGS: ${KAFKA_TOPIC_METER_READINGS:-meter-readings}
  KAFKA_TOPIC_ALERTS:         ${KAFKA_TOPIC_ALERTS:-alerts}
  POSTGRES_HOST:              ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT:              ${POSTGRES_PORT:-5432}
  POSTGRES_DB:                ${POSTGRES_DB:-gridpulse}
  POSTGRES_USER:              ${POSTGRES_USER:-gridpulse}
  POSTGRES_PASSWORD:          ${POSTGRES_PASSWORD:-gridpulse_secret}
  RENEWABLE_ALERT_THRESHOLD:  ${RENEWABLE_ALERT_THRESHOLD:-20.0}
  WINDOW_DURATION_SHORT:      ${WINDOW_DURATION_SHORT:-1 minute}
  WINDOW_DURATION_LONG:       ${WINDOW_DURATION_LONG:-5 minutes}
  CHECKPOINT_DIR:             /tmp/gridpulse-checkpoints

services:

  # ── Zookeeper ───────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: ruok,srvr,stat,mntr
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/commands/srvr > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log

  # ── Kafka ───────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092"   # host access for local tools / kafkacat
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "false"
      KAFKA_LOG_RETENTION_HOURS:              24
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ── Kafka topic setup (runs once, then exits) ────────────────────────────────
  kafka-setup:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: on-failure

  # ── Kafka metrics exporter → Prometheus ─────────────────────────────────────
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    depends_on:
      kafka:
        condition: service_healthy
    command: ["--kafka.server=kafka:9092"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9308/metrics | head -1"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-gridpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridpulse_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-gridpulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-gridpulse.sql:ro
      - ./db/init-airflow.sql:/docker-entrypoint-initdb.d/02-airflow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridpulse}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Spark streaming job ──────────────────────────────────────────────────────
  spark-job:
    build:
      context: ./spark
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    environment:
      <<: *spark-env
    volumes:
      - spark-checkpoints:/tmp/gridpulse-checkpoints
      - spark-ivy:/root/.ivy2
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f streaming_job || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Meter producer ───────────────────────────────────────────────────────────
  meter-producer:
    build:
      context: ./generators
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS:    ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC_METER_READINGS: ${KAFKA_TOPIC_METER_READINGS:-meter-readings}
      SIMULATED_DAY_SECONDS:      ${SIMULATED_DAY_SECONDS:-300}
      METER_EMIT_INTERVAL_MIN:    ${METER_EMIT_INTERVAL_MIN:-2}
      METER_EMIT_INTERVAL_MAX:    ${METER_EMIT_INTERVAL_MAX:-5}
      NUM_METERS:                 ${NUM_METERS:-30}
      GRID_ZONES:                 ${GRID_ZONES:-ZONE_A,ZONE_B,ZONE_C}
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; data=open('/proc/1/cmdline','rb').read(); sys.exit(0 if b'meter_producer' in data else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ── Airflow init (one-shot) ──────────────────────────────────────────────────
  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin
      --firstname GridPulse --lastname Admin
      --role Admin --email admin@gridpulse.local || true"
    restart: on-failure

  # ── Airflow webserver ────────────────────────────────────────────────────────
  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      <<: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./generators:/opt/airflow/generators
      - airflow-logs:/opt/airflow/logs
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    restart: on-failure

  # ── Airflow scheduler ────────────────────────────────────────────────────────
  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./generators:/opt/airflow/generators
      - airflow-logs:/opt/airflow/logs
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: on-failure

  # ── FastAPI serving layer ────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST:     ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT:     ${POSTGRES_PORT:-5432}
      POSTGRES_DB:       ${POSTGRES_DB:-gridpulse}
      POSTGRES_USER:     ${POSTGRES_USER:-gridpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridpulse_secret}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

  # ── Dashboard (served as static files via nginx) ─────────────────────────────
  dashboard:
    image: nginx:1.25-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED:  "true"
      GF_SERVER_ROOT_URL:         http://localhost:3001
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  postgres-data:
  spark-checkpoints:
  spark-ivy:
  airflow-logs:
  prometheus-data:
  grafana-data:
